<p-drawer
  position="right"
  [visible]="client() !== null"
  [header]="clientName()"
  [modal]="true"
  [dismissible]="true"
  [closeOnEscape]="false"
  [blockScroll]="true"
  [style]="{ width: 'min(52rem, 100vw)' }"
  ariaCloseLabel="Close addresses"
  (visibleChange)="onDrawerVisibleChange($event)"
  (onShow)="focusAddressesHeading()"
>
  <section class="flex flex-column gap-3" aria-labelledby="addresses-heading">
    <div class="flex flex-wrap align-items-center justify-content-between gap-2">
      <h2 #addressesHeading id="addresses-heading" class="section-title" tabindex="-1">Addresses</h2>
      <p-button label="Add Address" icon="pi pi-plus" [disabled]="loading() || loadErrorMessage() !== null" (onClick)="openCreateDialog()" />
    </div>

    @if (loadErrorMessage(); as message) {
      <p-message severity="error" styleClass="w-full">
        <div class="flex flex-wrap align-items-center justify-content-between gap-3 w-full">
          <span class="error-text">{{ message }}</span>
          <p-button label="Retry" icon="pi pi-refresh" severity="danger" [outlined]="true" size="small" (onClick)="retry()" />
        </div>
      </p-message>
    }

    <app-client-address-list
      [addresses]="addresses()"
      [loading]="loading()"
      [deletingAddressId]="deletingAddressId()"
      (editAddress)="openEditDialog($event)"
      (deleteAddress)="requestAddressDeletion($event)"
    />
  </section>
</p-drawer>

<p-dialog
  appendTo="body"
  [header]="dialogTitle()"
  [visible]="dialogVisible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '640px': 'calc(100vw - 2rem)' }"
>
  @if (dialogVisible()) {
    <div class="flex flex-column gap-3" (keydown.escape)="onFormEscape($event)">
      @if (dialogErrorMessage(); as message) {
        <p-message severity="error" styleClass="w-full">{{ message }}</p-message>
      }
      <app-client-address-form
        [address]="editingAddress()"
        [submitting]="submitting()"
        [serverErrors]="serverFieldErrors()"
        (saveRequested)="saveAddress($event)"
        (cancelRequested)="requestDialogClose()"
        (dirtyChange)="onFormDirtyChange($event)"
      />
    </div>
  }
</p-dialog>
