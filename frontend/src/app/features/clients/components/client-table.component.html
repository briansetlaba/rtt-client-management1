<p-table
  [value]="clients()"
  dataKey="clientId"
  [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  [loading]="loading()"
  [paginator]="true"
  [rows]="pageSize()"
  [first]="firstRecordIndex()"
  [totalRecords]="totalRecords()"
  [rowsPerPageOptions]="pageSizeOptions()"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} clients"
  [scrollable]="true"
  [tableStyle]="{ 'min-width': '40rem' }"
  [stripedRows]="true"
>
  <ng-template #header>
    <tr>
      <th scope="col">Client ID</th>
      <th scope="col">First Name</th>
      <th scope="col">Last Name</th>
      <th scope="col">Gender</th>
      <th scope="col">Date of Birth</th>
      <th scope="col" class="actions-column"><span class="visually-hidden">Actions</span></th>
    </tr>
  </ng-template>
  <ng-template #body let-client>
    <tr>
      <td>{{ client.clientId }}</td>
      <td>{{ client.firstName }}</td>
      <td>{{ client.lastName }}</td>
      <td>{{ client.gender }}</td>
      <td>{{ client.dateOfBirth ?? '—' }}</td>
      <td class="actions-column">
        <div class="row-actions">
          <p-button
            icon="pi pi-map-marker"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [disabled]="deletingClientId() === client.clientId"
            [ariaLabel]="'Manage addresses for ' + client.firstName + ' ' + client.lastName"
            (onClick)="manageAddresses.emit(client)"
          />
          <p-button
            icon="pi pi-address-book"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [disabled]="deletingClientId() === client.clientId"
            [ariaLabel]="'Manage contacts for ' + client.firstName + ' ' + client.lastName"
            (onClick)="manageContacts.emit(client)"
          />
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [disabled]="deletingClientId() === client.clientId"
            [ariaLabel]="'Edit client ' + client.firstName + ' ' + client.lastName"
            (onClick)="editClient.emit(client)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            [loading]="deletingClientId() === client.clientId"
            [disabled]="deletingClientId() !== null"
            [ariaLabel]="'Delete client ' + client.firstName + ' ' + client.lastName"
            (onClick)="deleteClient.emit(client)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6" class="text-center text-muted py-5">
        @if (!loading()) {
          {{ emptyMessage() }}
        }
      </td>
    </tr>
  </ng-template>
</p-table>
